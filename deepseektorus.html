<!DOCTYPE html>
<html>
<head>
    <title>Cyber Toroid</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a2e, #000);
            font-family: 'Orbitron', sans-serif;
        }

        .cyber-title {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #0ff;
            font-size: 2.5em;
            text-shadow: 0 0 10px #0ff,
                         0 0 20px #0ff,
                         0 0 30px #0ff;
            animation: glitch 2s infinite;
            z-index: 100;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .grid-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 1;
        }

        .scanline {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                transparent 50%,
                rgba(0, 255, 255, 0.1) 51%,
                transparent 51%);
            background-size: 100% 4px;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="cyber-title">CYBER-TORUS v2.0</h1>
    <div class="grid-overlay"></div>
    <div class="scanline"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let mouseX = 0;
        let mouseY = 0;

        // Inicialização da cena
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        // Material cyberpunk
        const material = new THREE.MeshStandardMaterial({
            color: 0xff00ff,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x00ffff,
            emissiveIntensity: 0.5,
            transparent: true,
            wireframe: true,
            wireframeLinewidth: 2
        });

        // Geometria do toróide
        const geometry = new THREE.TorusGeometry(10, 3, 64, 128);
        const torus = new THREE.Mesh(geometry, material);
        scene.add(torus);

        // Sistema de partículas
        const particles = new THREE.BufferGeometry();
        const particleCount = 5000;
        const posArray = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 50;
        }

        particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x00ffff,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const particleMesh = new THREE.Points(particles, particleMaterial);
        scene.add(particleMesh);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0x220066, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff00ff, 2, 100);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        const neonGlow = new THREE.PointLight(0x00ffff, 3, 50);
        neonGlow.position.set(-20, -20, -20);
        scene.add(neonGlow);

        camera.position.z = 35;
        camera.position.y = 15;

        // Controle do mouse
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;
        });

        // Animação
        let autoRotation = true;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Rotação automática com influência do mouse
            if(autoRotation) {
                torus.rotation.x = time * 0.2 + mouseY * 0.5;
                torus.rotation.y = time * 0.3 + mouseX * 0.5;
            }

            // Animação de partículas
            particleMesh.rotation.y = time * 0.1;
            particleMesh.rotation.x = time * 0.1;

            // Efeito de pulsação
            torus.scale.set(
                1 + Math.sin(time) * 0.1,
                1 + Math.cos(time) * 0.1,
                1 + Math.sin(time) * 0.1
            );

            // Movimento da câmera
            camera.position.z = 35 + Math.sin(time) * 5;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        // Controles de interação
        document.addEventListener('click', () => {
            autoRotation = !autoRotation;
            material.wireframe = !material.wireframe;
            material.emissive.setHex(autoRotation ? 0x00ffff : 0xff00ff);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

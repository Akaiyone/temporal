<!DOCTYPE html>
<html>
<head>
    <title>Steampunk 3D Gallery</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #D4AF37;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 2px 2px 2px #000;
            z-index: 100;
        }
        .steampunk-border {
            position: fixed;
            border: 3px solid #B87333;
            pointer-events: none;
            margin: 20px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-shadow: 0 0 20px #8B0000;
        }
    </style>
</head>
<body>
    <div id="info">STEAMPUNK GEOMETRIC ENGINE - [PRESS ESC TO EXIT]</div>
    <div class="steampunk-border"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, shapes = [];
        let isAnimating = true;

        const colors = [
            0xB87333, 0xD4AF37, 0x8B0000, 0x6C541E, 0xCD7F32
        ];

        const geometries = [
            () => new THREE.SphereGeometry(1.2, 16, 12),
            () => new THREE.CylinderGeometry(0.8, 0.8, 2.5, 16),
            () => new THREE.TorusGeometry(1.5, 0.4, 16, 32),
            () => new THREE.OctahedronGeometry(1.8),
            () => new THREE.IcosahedronGeometry(1.8),
            () => new THREE.TorusKnotGeometry(1.2, 0.3, 64, 16),
            () => new THREE.ConeGeometry(1.2, 2.5, 16)
        ];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x1a1a1a);
            document.body.appendChild(renderer.domElement);

            // Configuração de iluminação
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xD4AF37, 0.8);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);

            // Posições das formas em um padrão circular
            const radius = 8;
            const positions = [];
            for(let i = 0; i < 7; i++) {
                const angle = (i * (Math.PI * 2)) / 7;
                positions.push({
                    x: Math.cos(angle) * radius,
                    z: Math.sin(angle) * radius
                });
            }

            // Criar e posicionar as formas
            geometries.forEach((geoFunc, i) => {
                const material = new THREE.MeshPhongMaterial({
                    color: colors[i % colors.length],
                    wireframe: true,
                    shininess: 100
                });

                const geometry = geoFunc();
                const mesh = new THREE.Mesh(geometry, material);

                // Posicionamento
                mesh.position.x = positions[i].x;
                mesh.position.z = positions[i].z;
                mesh.position.y = 0;

                scene.add(mesh);
                shapes.push(mesh);
            });

            camera.position.set(0, 15, 20);
            camera.lookAt(0, 0, 0);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    isAnimating = false;
                    document.body.innerHTML = '<h1 style="color:#D4AF37;text-align:center">ENGINE SHUTDOWN</h1>';
                }
            });

            animate();
        }

        function animate() {
            if (!isAnimating) return;

            requestAnimationFrame(animate);

            // Animar cada forma individualmente
            shapes.forEach((shape, i) => {
                shape.rotation.x += 0.005;
                shape.rotation.y += 0.005;

                // Adicionar movimento vertical oscilante
                shape.position.y = Math.sin(Date.now() * 0.001 + i) * 1.5;
            });

            // Rotação da câmera
            camera.position.x = Math.sin(Date.now() * 0.0005) * 20;
            camera.position.z = Math.cos(Date.now() * 0.0005) * 20;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        init();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

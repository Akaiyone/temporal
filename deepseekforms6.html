<!DOCTYPE html>
<html>
<head>
    <title>Steampunk Interactive Geometry</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #D4AF37;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 2px 2px 2px #000;
            z-index: 100;
        }
        .steampunk-border {
            position: fixed;
            border: 3px solid #B87333;
            pointer-events: none;
            margin: 20px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-shadow: 0 0 20px #8B0000;
        }
    </style>
</head>
<body>
    <div id="info">STEAMPUNK GEOMETRY LAB - [CLICK/DRAG: CORES] [CLIQUE FORMAS: MULTIPLICAR] [ESC: SAIR]</div>
    <div class="steampunk-border"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, shapes = [];
        let isAnimating = true;
        let isDragging = false;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredObject = null;
        let selectedObject = null;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraTarget = new THREE.Vector3(0, 50, 60);
        let zoomSpeed = 0.1;
        let dragSpeed = 0.005;

        const geometries = [
            () => new THREE.SphereGeometry(3.6, 32, 24),
            () => new THREE.CylinderGeometry(2.4, 2.4, 7.5, 32),
            () => new THREE.TorusGeometry(4.5, 1.2, 32, 64),
            () => new THREE.OctahedronGeometry(5.4),
            () => new THREE.IcosahedronGeometry(5.4),
            () => new THREE.TorusKnotGeometry(3.6, 0.9, 128, 32),
            () => new THREE.ConeGeometry(3.6, 7.5, 32),
            () => new THREE.TetrahedronGeometry(5.4),
            () => new THREE.DodecahedronGeometry(5.4),
            () => new THREE.ExtrudeGeometry(
                new THREE.Shape()
                    .moveTo(0,0)
                    .lineTo(3,0)
                    .lineTo(1.5,4.5),
                { depth: 1, bevelEnabled: true }
            ),
            () => new THREE.LatheGeometry([
                new THREE.Vector2(0,0),
                new THREE.Vector2(3,3),
                new THREE.Vector2(6,0)
            ], 24),
            () => new THREE.RingGeometry(3, 4.5, 32),
            () => new THREE.CapsuleGeometry(2.4, 4.5, 8, 16),
            () => new THREE.TubeGeometry(
                new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(6, 6, 0),
                    new THREE.Vector3(0, 12, 0)
                ]),
                128,
                1.5,
                16,
                false
            ),
            () => new THREE.ParametricGeometry((u, v, target) => {
                u = u * 6 - 3;
                v = v * 6 - 3;
                target.set(u, v, Math.sin(u*v) * 3);
            }, 48, 48),
            () => new THREE.ConvexGeometry([
                new THREE.Vector3(-3,-3,-3),
                new THREE.Vector3(3,-3,-3),
                new THREE.Vector3(-3,3,-3),
                new THREE.Vector3(3,3,-3),
                new THREE.Vector3(-3,-3,3),
                new THREE.Vector3(3,-3,3),
                new THREE.Vector3(-3,3,3),
                new THREE.Vector3(3,3,3)
            ]),
            () => new THREE.TorusKnotGeometry(4.5, 1.5, 128, 32, 2, 3),
            () => new THREE.BoxGeometry(6, 6, 6),
            () => new THREE.SphereGeometry(4.5, 64, 32, 0, Math.PI)
        ];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x1a1a1a);
            document.body.appendChild(renderer.domElement);

            // Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
            directionalLight.position.set(20, 20, 20);
            scene.add(directionalLight);

            // Posicionamento inicial
            const radius = 30;
            const positions = [];
            for(let i = 0; i < geometries.length; i++) {
                const angle = (i * (Math.PI * 2)) / geometries.length;
                positions.push({
                    x: Math.cos(angle) * radius,
                    z: Math.sin(angle) * radius
                });
            }

            // Criar formas
            geometries.forEach((geoFunc, i) => {
                try {
                    const geometry = geoFunc();
                    const material = new THREE.MeshPhongMaterial({
                        color: new THREE.Color(Math.random(), Math.random(), Math.random()),
                        wireframe: true,
                        emissive: 0x000000,
                        shininess: 100,
                        transparent: true,
                        opacity: 0.9
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(positions[i].x, 0, positions[i].z);
                    mesh.userData.originalPosition = mesh.position.clone();
                    scene.add(mesh);
                    shapes.push(mesh);
                } catch(e) {
                    console.warn(`Erro na forma ${i}:`, e);
                }
            });

            camera.position.copy(cameraTarget);
            camera.lookAt(0, 0, 0);

            // Event listeners
            document.addEventListener('keydown', (e) => e.key === 'Escape' && stopAnimation());
            setupInteraction();
            animate();
        }

        // ... (mantenha as funções setupInteraction, animate e outras inalteradas do código anterior) ...

    </script>
</body>
</html>

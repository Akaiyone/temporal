<!DOCTYPE html>
<html>
<head>
    <title>Steampunk 3D Interactive</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #D4AF37;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 2px 2px 2px #000;
            z-index: 100;
        }
        .steampunk-border {
            position: fixed;
            border: 3px solid #B87333;
            pointer-events: none;
            margin: 20px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-shadow: 0 0 20px #8B0000;
        }
    </style>
</head>
<body>
    <div id="info">STEAMPUNK COLOR ENGINE - [CLIQUE/ARRASTE PARA MUDAR CORES] [ESC PARA SAIR]</div>
    <div class="steampunk-border"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, shapes = [];
        let isAnimating = true;
        let isDragging = false;

        const geometries = [
            () => new THREE.SphereGeometry(1.2, 16, 12),
            () => new THREE.CylinderGeometry(0.8, 0.8, 2.5, 16),
            () => new THREE.TorusGeometry(1.5, 0.4, 16, 32),
            () => new THREE.OctahedronGeometry(1.8),
            () => new THREE.IcosahedronGeometry(1.8),
            () => new THREE.TorusKnotGeometry(1.2, 0.3, 64, 16),
            () => new THREE.ConeGeometry(1.2, 2.5, 16)
        ];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x1a1a1a);
            document.body.appendChild(renderer.domElement);

            // Configuração de iluminação dinâmica
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);

            // Posicionamento das formas
            const radius = 8;
            const positions = [];
            for(let i = 0; i < 7; i++) {
                const angle = (i * (Math.PI * 2)) / 7;
                positions.push({
                    x: Math.cos(angle) * radius,
                    z: Math.sin(angle) * radius
                });
            }

            // Criar formas com cores iniciais
            geometries.forEach((geoFunc, i) => {
                const geometry = geoFunc();
                const material = new THREE.MeshPhongMaterial({
                    color: this.generateRandomColor(),
                    wireframe: true,
                    shininess: 100
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(positions[i].x, 0, positions[i].z);
                scene.add(mesh);
                shapes.push(mesh);
            });

            camera.position.set(0, 15, 20);
            camera.lookAt(0, 0, 0);

            // Event listeners
            document.addEventListener('keydown', (e) => e.key === 'Escape' && stopAnimation());
            setupInteraction();
            animate();
        }

        function generateRandomColor() {
            return new THREE.Color(
                Math.random(),
                Math.random(),
                Math.random()
            );
        }

        function changeColors() {
            shapes.forEach(shape => {
                shape.material.color = generateRandomColor();
                shape.material.needsUpdate = true;
            });
        }

        function setupInteraction() {
            const domElement = renderer.domElement;

            domElement.addEventListener('pointerdown', (e) => {
                isDragging = true;
                changeColors();
            });

            domElement.addEventListener('pointermove', (e) => {
                if(isDragging) {
                    changeColors();
                }
            });

            domElement.addEventListener('pointerup', () => isDragging = false);
            domElement.addEventListener('pointerleave', () => isDragging = false);
        }

        function animate() {
            if(!isAnimating) return;

            requestAnimationFrame(animate);

            // Animar formas
            shapes.forEach((shape, i) => {
                shape.rotation.x += 0.005;
                shape.rotation.y += 0.005;
                shape.position.y = Math.sin(Date.now() * 0.001 + i) * 1.5;
            });

            // Animar câmera
            camera.position.x = Math.sin(Date.now() * 0.0005) * 20;
            camera.position.z = Math.cos(Date.now() * 0.0005) * 20;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        function stopAnimation() {
            isAnimating = false;
            document.body.innerHTML = '<h1 style="color:#D4AF37;text-align:center;margin-top:40vh">ENGINE SHUTDOWN</h1>';
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
